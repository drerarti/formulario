<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceso Agente | AYLLU</title>
  <style>
    :root {
      --login-bg: #08111e;
      --login-bg-soft: #122036;
      --login-card: rgba(10, 19, 34, 0.88);
      --login-card-border: rgba(198, 168, 90, 0.16);
      --login-text: #f8fafc;
      --login-text-soft: rgba(216, 225, 238, 0.72);
      --login-input: rgba(15, 27, 48, 0.96);
      --login-input-border: rgba(159, 176, 198, 0.26);
      --login-accent: #c6a85a;
      --login-accent-strong: #b48f3a;
      --login-shadow: 0 28px 70px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", sans-serif;
      color: var(--login-text);
      background:
        radial-gradient(circle at top left, rgba(198, 168, 90, 0.12), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(56, 189, 248, 0.12), transparent 28%),
        linear-gradient(145deg, #08111e 0%, #0d1728 46%, #16253b 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(28px);
      opacity: 0.56;
    }

    body::before {
      width: 280px;
      height: 280px;
      right: -72px;
      bottom: -88px;
      background: rgba(198, 168, 90, 0.1);
    }

    body::after {
      width: 220px;
      height: 220px;
      left: -56px;
      top: -48px;
      background: rgba(56, 189, 248, 0.08);
    }

    .login-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 460px);
    }

    .brand-lockup {
      margin-bottom: 16px;
      padding-inline: 6px;
    }

    .brand-mark {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--login-accent);
      margin-bottom: 8px;
    }

    .brand-sub {
      color: var(--login-text-soft);
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .login-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 34px 30px 28px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(13, 22, 37, 0.96), rgba(10, 19, 34, 0.88));
      border: 1px solid var(--login-card-border);
      box-shadow: var(--login-shadow);
      backdrop-filter: blur(18px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(90deg, rgba(198, 168, 90, 0.9), rgba(56, 189, 248, 0.5));
    }

    .login-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(198, 168, 90, 0.1);
      color: var(--login-accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .login-title {
      margin: 0;
      font-size: clamp(30px, 4vw, 38px);
      line-height: 1.04;
      letter-spacing: -0.03em;
      font-weight: 800;
      color: #f9fbff;
    }

    .login-copy {
      margin: -6px 0 0;
      color: var(--login-text-soft);
      font-size: 15px;
      line-height: 1.65;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #dbe6f3;
    }

    .field-input {
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid var(--login-input-border);
      background: var(--login-input);
      color: #f8fafc;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .field-input::placeholder {
      color: rgba(191, 204, 220, 0.5);
      font-weight: 500;
    }

    .field-input:focus {
      border-color: rgba(198, 168, 90, 0.68);
      box-shadow: 0 0 0 4px rgba(198, 168, 90, 0.12);
      transform: translateY(-1px);
    }

    .login-button {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--login-accent), var(--login-accent-strong));
      color: #0a1322;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 18px 28px rgba(180, 143, 58, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
      filter: saturate(1.04);
      box-shadow: 0 22px 34px rgba(180, 143, 58, 0.24);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:focus-visible {
      outline: 3px solid rgba(198, 168, 90, 0.28);
      outline-offset: 2px;
    }

    .login-note {
      margin: 0;
      color: rgba(191, 204, 220, 0.72);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 28px 22px 22px;
        border-radius: 24px;
      }

      .login-title {
        font-size: 28px;
      }

      .login-copy {
        font-size: 14px;
      }

      .field-input,
      .login-button {
        min-height: 52px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="brand-lockup">
      <div class="brand-mark">AYLLU</div>
      <div class="brand-sub">Sistema comercial inmobiliario</div>
    </div>

    <form class="login-card" onsubmit="event.preventDefault(); if (window.login) window.login();">
      <span class="login-eyebrow">Acceso de agentes</span>
      <h1 class="login-title">Ingresa a tu panel comercial</h1>
      <p class="login-copy">Ingresa tu código para acceder a tu panel comercial.</p>

      <div class="field-group">
        <label for="codigo">Código de agente</label>
        <input
          id="codigo"
          class="field-input"
          name="codigo"
          type="text"
          placeholder="Ejemplo: AG01"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus
        />
      </div>

      <button class="login-button" type="submit">Ingresar</button>
      <p class="login-note">Acceso seguro para seguimiento de reservas, ventas y clientes.</p>
    </form>
  </div>

  <script src="js/app-core.js"></script>
  <script src="login-agente.page.js"></script>
</body>
</html>
