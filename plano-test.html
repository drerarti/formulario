function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(
    atob(base64)
      .split('')
      .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
      .join('')
  );
  return JSON.parse(jsonPayload);
}

function resaltarManzana(loteId){

  const partes = loteId.split("-");
  const manzana = partes[2];

  const svg = document.querySelector('#plano-container svg');

  svg.querySelectorAll("path").forEach(p => {

    const id = p.id;

    if(!id) return;

    if(id.includes(`-${manzana}-`)){
      p.classList.add("manzana-highlight");
    }

  });

}
function zoomManzana(manzana){

  const svg = document.querySelector('#plano-container svg');

  const lotes = Array.from(svg.querySelectorAll("path"))
    .filter(p => p.id.includes(`-${manzana}-`));

  if(lotes.length === 0) return;

  let minX=Infinity,minY=Infinity,maxX=0,maxY=0;

  lotes.forEach(l=>{
    const b = l.getBBox();
    minX = Math.min(minX,b.x);
    minY = Math.min(minY,b.y);
    maxX = Math.max(maxX,b.x+b.width);
    maxY = Math.max(maxY,b.y+b.height);
  });

  const cx = (minX+maxX)/2;
  const cy = (minY+maxY)/2;

  const scale = 2;

  const currentScale = panzoom.getScale();
panzoom.zoom(scale / currentScale, { animate:true });

  const wrapper = document.getElementById("plano-wrapper");
const rect = wrapper.getBoundingClientRect();

setTimeout(()=>{

 const newScale = panzoom.getScale();

panzoom.pan(
  rect.width/2 - cx * newScale,
  rect.height/2 - cy * newScale,
  { animate:true, duration:600 }
);

},300);
}
function limpiarManzana(){

  const svg = document.querySelector('#plano-container svg');

  svg.querySelectorAll(".manzana-highlight")
     .forEach(p=>p.classList.remove("manzana-highlight"));

}

function descargarPlano(){

const svg = document.querySelector("#plano-container svg");

if(!svg){
  alert("Plano no cargado");
  return;
}

const serializer = new XMLSerializer();
const source = serializer.serializeToString(svg);

const img = new Image();
const svgBlob = new Blob([source], {type:"image/svg+xml;charset=utf-8"});
const url = URL.createObjectURL(svgBlob);

img.onload = function(){

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

const scale = 3;

canvas.width = img.width * scale;
canvas.height = img.height * scale;

ctx.scale(scale, scale);

// fondo blanco
ctx.fillStyle = "#ffffff";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);

  const link = document.createElement("a");
  link.download = `plano-${proyecto}-${fase}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();

  URL.revokeObjectURL(url);

};

img.src = url;

}
async function descargarPlanoPDF(){

const svg = document.querySelector("#plano-container svg");

if(!svg){
  alert("Plano no cargado");
  return;
}

const serializer = new XMLSerializer();
const source = serializer.serializeToString(svg);

const img = new Image();
const svgBlob = new Blob([source], {type:"image/svg+xml;charset=utf-8"});
const url = URL.createObjectURL(svgBlob);

img.onload = function(){

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

const scale = 2;

canvas.width = img.width * scale;
canvas.height = img.height * scale;

ctx.scale(scale, scale);

// fondo blanco
ctx.fillStyle = "#ffffff";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);

  const imgData = canvas.toDataURL("image/jpeg",0.8);

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF("landscape","pt","a3");

  pdf.text(`Proyecto: ${proyecto} - Fase: ${fase}`,40,40);

const pageWidth = pdf.internal.pageSize.getWidth();
const pageHeight = pdf.internal.pageSize.getHeight();

const margin = 40;

const maxWidth = pageWidth - margin * 2;
const maxHeight = pageHeight - 100;

let width = maxWidth;
let height = canvas.height * width / canvas.width;

if (height > maxHeight) {
  height = maxHeight;
  width = canvas.width * height / canvas.height;
}

pdf.addImage(imgData,"JPEG",margin,60,width,height);
  pdf.save(`plano-${proyecto}-${fase}.pdf`);

  URL.revokeObjectURL(url);

};

img.src = url;

}
function iniciarVisor360() {

  const totalVistas = vistas360Config[claveProyecto] || 1;
  const ruta = `/assets/360/${claveProyecto}/0${vistaActual}.jpg`;

  if (viewer) {
    viewer.destroy();
  }

  viewer = pannellum.viewer('visor360', {
    type: 'equirectangular',
    panorama: ruta,
    autoLoad: true,
    showZoomCtrl: true,
    showFullscreenCtrl: false,
    compass: false
  });

  document.getElementById("contador360").innerText =
    `Vista ${vistaActual} de ${totalVistas}`;
}
