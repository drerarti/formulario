<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano Comercial | Ayllu Laguna Huaypo</title>
<link rel="stylesheet" href="plano.css">
</head>
<body class="plano-page plano-agent">
  <div class="plano-shell">
    <div id="top-panel">
      <div id="top-bar">
        <span id="mini-info"></span>
        <span id="toggle-panel">v</span>
      </div>
      <div id="top-content" class="active">
        <div class="plano-header-row">
          <div id="header">
            <span id="headerKicker" class="plano-kicker">Plano comercial</span>
            <h1 id="headerTitle" class="plano-title">Plano maestro</h1>
            <p id="headerSubtitle" class="plano-subtitle">Disponibilidad y reserva en tiempo real.</p>
          </div>
          <div class="plano-toolbar">
            <button id="btnPresentacion" class="btn-ghost" type="button">Modo presentacion</button>
            <button id="btnVisibility" class="btn-ghost" type="button">Modo sol</button>
            <button id="btnResetView" class="btn-outline" type="button">Reset vista</button>
            <button id="btn360" class="btn-outline hidden" type="button">Vista 360</button>
            <button id="btnExportPng" class="btn-outline" type="button">PNG</button>
            <button id="btnExportPdf" class="btn-outline" type="button">PDF</button>
            <button id="btnLogout" class="btn-outline" type="button">Salir</button>
          </div>
        </div>

        <div id="selector-proyecto">
          <div id="buscador-lote">
            <input type="text" id="inputLote" placeholder="Buscar lote o codigo">
            <button id="btnBuscarLote" class="btn-outline" type="button">Buscar</button>
            <div id="sugerencias-lotes" class="hidden"></div>
          </div>
          <select id="selectProyecto">
            <option value="ALP">Alpinas</option>
            <option value="PR">Piuray</option>
            <option value="VG">Virgilio</option>
            <option value="LMF">Luz Miraflores</option>
            <option value="Asnacpujio">Asnacpujio-11000</option>
            <option value="718">718m2</option>
          </select>
          <select id="selectFase">
            <option value="F1">F1</option>
            <option value="F2">F2</option>
          </select>
        </div>

        <div id="resumen"></div>

        <div id="filtros">
          <label><input type="checkbox" value="disponible" checked> Disponible</label>
          <label><input type="checkbox" value="reservado" checked> Reservado</label>
          <label><input type="checkbox" value="vendido" checked> Vendido</label>
          <label><input type="checkbox" value="financiado" checked> Financiado</label>
        </div>
      </div>
    </div>

    <section class="plano-stage">
      <div id="plano-wrapper">
        <div id="planoLoading"></div>
        <div id="plano-container"></div>
      </div>
    </section>
  </div>

  <div id="tooltip"></div>
  <div id="panelOverlay"></div>

  <aside id="mobile-card" aria-hidden="true">
    <div class="panel-handle"></div>
    <div class="detail-panel-scroll">
      <div class="detail-heading">
        <div>
          <div id="detailEyebrow" class="detail-eyebrow">Detalle del lote</div>
          <h2 id="detailTitle" class="detail-title">Selecciona un lote</h2>
          <p id="detailSubtitle" class="detail-subtitle">Explora disponibilidad y reserva.</p>
        </div>
        <div>
          <button id="detailClose" type="button" aria-label="Cerrar">&times;</button>
        </div>
      </div>

      <div id="detailStatusBadge"></div>
      <div id="detailMetrics" class="detail-metrics"></div>
      <div id="detailPrimaryActions" class="detail-actions"></div>
      <section id="detailPublicBlock" class="detail-card"></section>
      <section id="detailCommercialBlock" class="detail-card hidden"></section>
      <section id="detailOperationalBlock" class="detail-card hidden"></section>
      <section id="detailEditBlock" class="detail-card hidden"></section>
    </div>
  </aside>

  <div id="modal360" class="modal-360 hidden">
    <div class="modal-header">
      <span id="contador360">Vista 1 de 1</span>
      <button id="cerrar360" class="btn-outline" type="button">Cerrar</button>
    </div>
    <div id="visor360"></div>
  </div>

  <script src="/js/panzoom.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/app-core.js"></script>
  <script src="js/plano-utils.js"></script>
  <script src="js/plano-experience.js"></script>
  <script src="plano-agent.page.js"></script>
</body>
</html>
