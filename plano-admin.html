<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano Dinámico</title>

<style>
body { font-family: Arial; margin:0; }

#header {
  padding:10px;
  background:#111;
  color:white;
  font-size:14px;
}

#plano-wrapper {
  width: 100%;
   height: calc(100vh - 180px);
  overflow: hidden;
  touch-action: none;
  background: #e9ecef;
}

#plano-container{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

#plano-container svg{
  width:100%;
  height:100%;
  object-fit:contain;
}
path {
  transition: fill 0.3s ease;
  cursor: pointer;
}

path.selected {
  stroke: #000;
  stroke-width: 2;
}
.manzana-highlight{
  filter: brightness(1.15);
  stroke: #333;
  stroke-width: 1.5;
}
#tooltip {
  position: absolute;
  background: white;
  border: 1px solid #ccc;
  padding: 8px 12px;
  font-size: 13px;
  border-radius: 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  pointer-events: none;
  display: none;
  z-index: 1000;
}

#mobile-card {
  position: fixed;
  bottom: 0;
  left: 0;

  width: 100%;
  box-sizing: border-box; /* 🔥 CLAVE */

  max-height: 45vh;
  overflow-y: auto;

  background: white;
  padding: 14px 16px 18px 16px;

  box-shadow: 0 -6px 25px rgba(0,0,0,0.18);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;

  transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  transform: translateY(100%);
  z-index: 9999;
}
#mobile-card h3 {
  margin: 0 0 8px 0;
  font-size: 18px;
}

#mobile-card p {
  margin: 4px 0;
  font-size: 14px;
}
#mobile-card.active {
  transform: translateY(0);
}

.close-card {
  position: absolute;
  right: 15px;
  top: 10px;
  font-size: 18px;
  cursor: pointer;
}
#filtros{
  padding:8px 10px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  font-size:13px;
  background:#fafafa;
}

#filtros label{
  background:#eee;
  padding:6px 10px;
  border-radius:20px;
}
#selector-proyecto {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #222;
}

#selector-proyecto select {
  flex: 1;
  padding: 8px;
  border-radius: 6px;
  border: none;
  font-size: 14px;
}
#resumen{
  padding:10px;
  font-size:13px;
  display:flex;
  gap:10px;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid #ddd;
  color:#333;
}
.btn-reservar {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: linear-gradient(135deg,#28a745,#218838);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  
}
.blur-bg {
  filter: blur(1px) brightness(0.9);
  transition: filter 0.3s ease;
}
#top-panel {
  position: relative;
  z-index: 2000;
}

#top-bar {
  display: none;
  background: #111;
  color: white;
  padding: 10px 14px;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#toggle-panel {
  cursor: pointer;
  font-size: 16px;
}

#top-content {
  transition: max-height 0.35s ease, opacity 0.3s ease;
}

/* 📱 SOLO EN MÓVIL */
@media (max-width: 768px) {

  #top-bar {
    display: flex;
  }

  #top-content {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
  }

  #top-content.active {
    max-height: 600px;
    opacity: 1;
  }

}
.modal-360 {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  display: flex;
  flex-direction: column;
}

.modal-360.hidden {
  display: none;
}

.modal-header {
  color: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

#visor360 {
  flex: 1;
}
#btnPresentacion {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg,#000,#1c1c1c);
  color: white;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
  transition: all 0.25s ease;
  box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  letter-spacing: 0.5px;
}

#btnPresentacion:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.45);
}
text {
  pointer-events: none;
  font-weight: bold;
  vector-effect: non-scaling-stroke;
  font-size:14px;
}
path:hover {
  stroke: #000;
  stroke-width: 1.5;
  filter: brightness(1.15);
}
#selector-proyecto{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  background:#1a1a1a;
}

#buscador-lote{
  flex:1 1 100%;
  display:flex;
  align-items:center;
  gap:6px;
  background:white;
  border-radius:10px;
  padding:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

#selector-proyecto select{
  flex:1;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#2b2b2b;
  color:white;
}
#buscador-lote input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  font-size:14px;
}


#buscador-lote button{
  flex:0 0 auto;
  padding:8px 12px;
  background:#111;
  color:white;
  border:none;
  border-radius:6px;
  font-size:14px;
}
#sugerencias-lotes{
  position:absolute;
  background:white;
  border:1px solid #ddd;
  border-radius:6px;
  width:100%;
  max-height:180px;
  overflow-y:auto;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  z-index:5000;
}

.sugerencia-item{
  padding:8px 10px;
  font-size:14px;
  cursor:pointer;
}

.sugerencia-item:hover{
  background:#f0f0f0;
}
#panel-valorizacion{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
background:#f5f5f5;
}

.card-val{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card-val h4{
font-size:12px;
margin:0;
color:#666;
}

.card-val span{
font-size:16px;
font-weight:bold;
}
body.no-scroll { overflow: hidden; }
</style>
</head>

<body>
<div id="panel-valorizacion">

<div class="card-val">
<h4>Valor actual</h4>
<span id="valActual">S/ 0</span>
</div>

<div class="card-val">
<h4>Valor proyectado</h4>
<span id="valProyectado">S/ 0</span>
</div>

<div class="card-val">
<h4>Ingresos estimados</h4>
<span id="valGanancia">S/ 0</span>
</div>

<div class="card-val">
<h4>Precio promedio m²</h4>
<span id="valPromedioM2">S/ 0</span>
</div>
<div class="card-val">
<h4>Valor disponible</h4>
<span id="valDisponible">S/ 0</span>
</div>

<div class="card-val">
<h4>% vendido</h4>
<span id="valVendido">0%</span>
</div>
</div>
<div id="proyeccionResumen" style="
padding:10px;
background:#fff;
border-bottom:1px solid #ddd;
font-size:13px;">
</div>
<div style="
background:#fff;
padding:10px;
border-bottom:1px solid #ddd;
display:flex;
gap:8px;
flex-wrap:wrap;
">

<select id="tipoVariacion">
<option value="porcentaje">%</option>
<option value="monto">Monto</option>
</select>

<input 
id="variacionPrecio"
type="number"
placeholder="Valor"
style="width:80px"
>

<button onclick="simularPrecios()">
Simular
</button>

</div>
<div id="top-panel">

  <div id="top-bar">
    <span id="mini-info"></span>
    <span id="toggle-panel">▼</span>
  </div>
  <div id="top-content">
    <div id="header"></div>
    <button id="btnPresentacion">Modo Presentación</button>
<div id="selector-proyecto">
  <div id="buscador-lote">
  <input 
    type="text" 
    id="inputLote"
    placeholder="Buscar lote (ej: L35)"
  >
<div id="sugerencias-lotes"></div>
  <button id="btnBuscarLote">Buscar</button>
</div>
  <select id="selectProyecto">
    <option value="ALP">Alpinas</option>
    <option value="PR">Piuray</option>
    <option value="VG">Virgilio</option>
    <option value="LMF">Luz Miraflores</option>
    <option value="Asnacpujio">Asnacpujio-11000</option>
    <option value="718">718m2</option>
  </select>

  <select id="selectFase">
    <option value="F1">F1</option>
    <option value="F2">F2</option>
  </select>
  <button onclick="logout()" style="margin-left:10px;">Salir</button>
</div>
<div id="resumen"></div>
<div id="filtros">
  <label><input type="checkbox" value="disponible" checked> Disponible</label>
  <label><input type="checkbox" value="reservado" checked> Reservado</label>
  <label><input type="checkbox" value="vendido" checked> Vendido</label>
  <label><input type="checkbox" value="financiado" checked> Financiado</label>
</div>
</div>
</div>
<div id="plano-wrapper">
  <div id="plano-container"></div>
</div>

<div id="tooltip"></div>

<div id="mobile-card"></div>

<script src="/js/panzoom.min.js"></script>
<div id="modal360" class="modal-360 hidden">
  <div class="modal-header">
    <span id="contador360">Vista 1 de 1</span>
    <button id="cerrar360">Cerrar</button>
  </div>

  <div id="visor360"></div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="plano-admin.js"></script>

</body>
</html>
